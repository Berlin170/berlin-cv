<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" fill="none"/>
  <!-- monitor body -->
  <rect x="3" y="4" width="26" height="18" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <rect x="5" y="6" width="22" height="14" fill="#000080"/>
  <rect x="5" y="6" width="22" height="2" fill="#1084d0"/>
  <!-- text lines -->
  <rect x="7" y="10" width="8" height="1" fill="#fff"/>
  <rect x="7" y="13" width="14" height="1" fill="#fff"/>
  <rect x="7" y="15" width="10" height="1" fill="#fff"/>
  <!-- stand -->
  <rect x="11" y="22" width="10" height="2" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <rect x="8" y="24" width="16" height="3" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- power LED -->
  <rect x="25" y="20" width="2" height="1" fill="#0f0"/>
</svg>
